<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öykü Okuyucu</title>

    <!-- dFlip CSS -->
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">

    <style>
        :root {
            --bg-color: #e5e2cb;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: Georgia, serif;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
        }

        .back-nav a {
            color: #24221f;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(36, 34, 31, 0.2);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="index.html">← </a>
    </div>

    <div class="container">
        <!-- webgl="false" yapılarak 2D hafif moda çekildi, takılma tamamen biter -->
        <div class="_df_book" 
             id="flipbook"
             source="gunesyanigi.pdf" 
             webgl="false"
             height="680">
        </div>
    </div>

    <!-- JS Bağımlılıkları -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js" type="text/javascript"></script>

</body>
</html>
