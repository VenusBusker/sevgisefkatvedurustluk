<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öykü Okuyucu</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --bg-color: #e5e2cb;
            --text-color: #24221f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: Georgia, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Geri Dön Butonu */
        .back-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 99;
        }

        .back-nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(36, 34, 31, 0.2);
            backdrop-filter: blur(5px);
        }

        #status {
            font-size: 0.9rem;
            color: var(--text-color);
        }

        /* A5 KİTAP SAYFASI */
        .reader-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .page-card {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border-radius: 2px;
            overflow: hidden;
            max-width: 90vw;
            max-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-card canvas {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
        }

        /* KONTROL PANELİ */
        .controls {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid rgba(36, 34, 31, 0.3);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.6);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-num {
            font-size: 0.85rem;
            color: var(--text-color);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="index.html">← Kapağa Dön</a>
    </div>

    <div id="status">Öykü hazırlanıyor...</div>

    <div class="reader-container" id="reader">
        <div class="page-card" id="pageCard">
            <canvas id="pdfCanvas"></canvas>
        </div>

        <div class="controls">
            <button class="btn" id="prevBtn" onclick="changePage(-1)">← Önceki</button>
            <span class="page-num" id="pageIndicator">1 / 1</span>
            <button class="btn" id="nextBtn" onclick="changePage(1)">Sonraki →</button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const pdfUrl = 'gunesyanigi.pdf';
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');

        function renderPage(num) {
            pageRendering = true;

            pdfDoc.getPage(num).then((page) => {
                const viewport = page.getViewport({ scale: 2 }); // Net görünüm için ölçek
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);

                renderTask.promise.then(() => {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            document.getElementById('pageIndicator').innerText = `${num} / ${pdfDoc.numPages}`;
            document.getElementById('prevBtn').disabled = (num <= 1);
            document.getElementById('nextBtn').disabled = (num >= pdfDoc.numPages);
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function changePage(delta) {
            if (pageNum + delta >= 1 && pageNum + delta <= pdfDoc.numPages) {
                pageNum += delta;
                queueRenderPage(pageNum);
            }
        }

        // Klavyedeki Ok Tuşlarıyla Sayfa Değiştirme
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') changePage(1);
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') changePage(-1);
        });

        // Ekrana Tıklayarak Sayfa Değiştirme
        document.getElementById('pageCard').addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (clickX > rect.width / 2) {
                changePage(1);
            } else {
                changePage(-1);
            }
        });

        pdfjsLib.getDocument(pdfUrl).promise.then((pdf) => {
            pdfDoc = pdf;
            document.getElementById('status').style.display = 'none';
            document.getElementById('reader').style.display = 'flex';
            renderPage(pageNum);
        }).catch((err) => {
            console.error(err);
            document.getElementById('status').innerText = 'PDF yüklenemedi. Dosya adını kontrol edin.';
        });
    </script>

</body>
</html>
