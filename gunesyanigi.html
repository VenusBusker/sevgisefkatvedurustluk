<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öykü Okuyucu</title>

    <!-- Mozilla PDF.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            /* Rosemary's Baby pastel zemin */
            --bg-color: #e5e2cb;
            --text-color: #24221f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 15px 40px 15px; /* Üst menü boşluğu */
        }

        /* ÜST NAVİGASYON */
        .back-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
        }

        .back-nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.6);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(36, 34, 31, 0.2);
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .back-nav a:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        #status {
            margin-top: 40vh;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* A5 SAYFA AKIŞI CONTAINER */
        #pages-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px; /* A5 kağıtlar arasındaki dikey boşluk */
            width: 100%;
            max-width: 650px; /* Ekrandaki maksimum A5 kağıt genişliği */
        }

        /* FİZİKSEL A5 KAĞIT HİSSİ */
        .page-canvas {
            background: #ffffff;
            width: 100% !important;
            height: auto !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border-radius: 2px;
            display: block;
        }

        /* MOBİL UYUM */
        @media (max-width: 600px) {
            body {
                padding: 70px 10px 20px 10px;
            }
            #pages-container {
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="index.html">← Kapağa Dön</a>
    </div>

    <div id="status">Öykü hazırlanıyor...</div>

    <!-- Bütün A5 sayfaları bu container içinde dikey dizilecek -->
    <div id="pages-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const pdfUrl = 'gunesyanigi.pdf'; // PDF dosya adınız

        async function loadAndRenderPdf() {
            const statusEl = document.getElementById('status');
            const container = document.getElementById('pages-container');

            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                statusEl.style.display = 'none';

                // Bütün sayfaları sırayla A5 kağıtlar halinde oluştur
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    
                    // Yüksek netlik için render ölçeği (Scale 2.5)
                    const viewport = page.getViewport({ scale: 2.5 });

                    const canvas = document.createElement('canvas');
                    canvas.className = 'page-canvas';
                    const ctx = canvas.getContext('2d');

                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    container.appendChild(canvas);
                }

            } catch (error) {
                console.error(error);
                statusEl.innerText = 'PDF yüklenirken bir sorun oluştu. Dosya adını kontrol edin.';
            }
        }

        loadAndRenderPdf();
    </script>

</body>
</html>
