<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öykü Okuyucu</title>

    <!-- Sadece Mozilla PDF İşleyicisi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            /* Rosemary's Baby pastel zemin */
            --bg-color: #e5e2cb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: Georgia, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* Geri Dön Butonu */
        .back-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
        }

        .back-nav a {
            color: #24221f;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(36, 34, 31, 0.2);
            backdrop-filter: blur(5px);
        }

        #status {
            position: absolute;
            font-size: 0.9rem;
            color: #24221f;
        }

        /* 3D Kitap Sahnesi */
        .book-wrapper {
            display: none;
            perspective: 1500px;
            cursor: pointer;
        }

        .book {
            width: 420px;
            height: 600px;
            position: relative;
            transform-style: preserve-3d;
        }

        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: left center;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: white;
            border-radius: 0 4px 4px 0;
        }

        .page canvas {
            width: 100%;
            height: 100%;
            border-radius: 0 4px 4px 0;
        }

        /* Sayfa Çevrilme Sınırları ve Gölge */
        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* Alt Navigasyon Kontrolü */
        .controls {
            position: fixed;
            bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 99;
        }

        .btn {
            background: #24221f;
            color: #e5e2cb;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-num {
            font-size: 0.85rem;
            color: #24221f;
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="index.html">← Kapağa Dön</a>
    </div>

    <div id="status">Öykü hazırlanıyor...</div>

    <div class="book-wrapper" id="wrapper">
        <div class="book" id="book"></div>
    </div>

    <div class="controls" id="controls" style="display: none;">
        <button class="btn" id="prevBtn" onclick="prevPage()">← Önceki Sayfa</button>
        <span class="page-num" id="pageIndicator">1 / 1</span>
        <button class="btn" id="nextBtn" onclick="nextPage()">Sonraki Sayfa →</button>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const pdfUrl = 'gunesyanigi.pdf'; // PDF dosya adınız
        let totalPages = 0;
        let currentPage = 1;
        const pages = [];

        async function initBook() {
            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                totalPages = pdf.numPages;

                const bookEl = document.getElementById('book');

                for (let i = 1; i <= totalPages; i++) {
                    const pageData = await pdf.getPage(i);
                    const viewport = pageData.getViewport({ scale: 1.5 });

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.style.zIndex = totalPages - i;

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await pageData.render({ canvasContext: ctx, viewport: viewport }).promise;

                    pageDiv.appendChild(canvas);
                    bookEl.appendChild(pageDiv);
                    pages.push(pageDiv);
                }

                document.getElementById('status').style.display = 'none';
                document.getElementById('wrapper').style.display = 'block';
                document.getElementById('controls').style.display = 'flex';
                updateUI();

                // Kitaba tıklandığında da sayfa çevirme
                document.getElementById('wrapper').addEventListener('click', (e) => {
                    if (e.clientX > window.innerWidth / 2) {
                        nextPage();
                    } else {
                        prevPage();
                    }
                });

            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "PDF yüklenemedi, dosya adını kontrol edin.";
            }
        }

        function nextPage() {
            if (currentPage <= totalPages) {
                pages[currentPage - 1].classList.add('flipped');
                currentPage++;
                updateUI();
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                pages[currentPage - 1].classList.remove('flipped');
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('pageIndicator').innerText = `${Math.min(currentPage, totalPages)} / ${totalPages}`;
            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (currentPage > totalPages);
        }

        initBook();
    </script>

</body>
</html>
