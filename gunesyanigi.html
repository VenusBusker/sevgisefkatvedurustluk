<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öykü Okuyucu</title>

    <style>
        :root {
            /* Rosemary's Baby pastel zemin */
            --bg-color: #e5e2cb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: Georgia, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Geri Dön Butonu */
        .back-nav {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 99;
        }

        .back-nav a {
            color: #24221f;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(36, 34, 31, 0.2);
            backdrop-filter: blur(5px);
        }

        /* PDF Çerçevesi (A5 Oranında) */
        .pdf-viewer {
            width: 90%;
            max-width: 550px; /* A5 En Oranı */
            height: 85vh;     /* Ekran boyunun %85'i */
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 4px;
            background-color: #fff;
        }

        @media (max-width: 600px) {
            .pdf-viewer {
                width: 95%;
                height: 80vh;
            }
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="index.html">← Kapağa Dön</a>
    </div>

    <!-- Tarayıcının Kendi Saf PDF Göstericisi -->
    <iframe 
        src="gunesyanigi.pdf#toolbar=0&navpanes=0&scrollbar=1" 
        class="pdf-viewer">
    </iframe>

</body>
</html>
