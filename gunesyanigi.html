<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öykü Okuyucu</title>

    <!-- dFlip Flipbook Kütüphanesi CSS ve Bağımlılıkları -->
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">

    <style>
        :root {
            /* Rosemary's Baby pastel zemin */
            --bg-color: #e5e2cb;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: Georgia, serif;
        }

        /* Kitap Okuyucu Konteynırı */
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Üst Menü / Geri Dön Butonu */
        .back-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
        }

        .back-nav a {
            color: #24221f;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(36, 34, 31, 0.2);
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }

        .back-nav a:hover {
            background: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <!-- Ana Sayfaya (Kapağa) Dönüş Butonu -->
    <div class="back-nav">
        <a href="index.html">← Kapağa Dön</a>
    </div>

    <!-- PDF FLIPBOOK OKUYUCU -->
    <div class="container">
        <!-- source kısmına PDF dosyanızın tam adını yazın -->
        <div class="_df_book" 
             id="flipbook"
             source="gece-yarisi.pdf" 
             webgl="true"
             height="650">
        </div>
    </div>

    <!-- jQuery ve dFlip JS Kütüphaneleri -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js" type="text/javascript"></script>

</body>
</html>
