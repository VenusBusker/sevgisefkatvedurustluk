<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevgi, Şefkat & Dürüstlük</title>
    <!-- Page-Flip ve PDF.js Kütüphaneleri -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@0.8.8/dist/js/page-flip.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0d0d; color: #fff; font-family: -apple-system, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden; }

        /* GİRİŞ EKRANI: METALİK KART */
        .card-container { perspective: 1000px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .card-hint { margin-top: 20px; font-size: 0.85em; letter-spacing: 2px; color: #888; text-transform: uppercase; animation: pulse 2s infinite; }
        
        .card {
            width: 320px;
            height: 452px;
            border-radius: 12px;
            background-image: url('Kapak.png'); /* Kartın üstündeki görsel */
            background-size: cover;
            background-position: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            transition: transform 0.1s ease-out;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(115deg, transparent 20%, rgba(255, 0, 150, 0.4) 40%, rgba(255, 255, 255, 0.7) 50%, rgba(0, 225, 255, 0.4) 60%, transparent 80%);
            mix-blend-mode: color-dodge;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .card:hover::before { opacity: 1; }

        /* DERGİ MODALI */
        #magazine-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 5, 0.96);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 30px;
            color: #fff; font-size: 2.5em; cursor: pointer;
            z-index: 10000; opacity: 0.8;
        }
        .close-btn:hover { color: #ff0055; }

        .flip-book { box-shadow: 0 0 50px rgba(0,0,0,0.9); }
        .page { background-color: #fff; }
        .page canvas { width: 100%; height: 100%; }

        #loading-text { font-size: 1.2em; color: #ff0055; letter-spacing: 1px; }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- GİRİŞ: METALİK KART -->
    <div class="card-container" id="cardContainer" onclick="openMagazine()">
        <div class="card" id="metalCard"></div>
        <div class="card-hint">✨ DERGİYİ AÇMAK İÇİN TIKLA ✨</div>
    </div>

    <!-- DERGİ MODALI -->
    <div id="magazine-modal">
        <span class="close-btn" onclick="closeMagazine()">&times;</span>
        <div id="loading-text">Dergi Sayfaları Yükleniyor...</div>
        <div id="book" class="flip-book" style="display:none;"></div>
    </div>

    <script>
        // PDF.js Worker Ayarı
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // Metalik Kart Hareketi
        const card = document.getElementById('metalCard');
        const container = document.getElementById('cardContainer');

        container.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rotateX = (y - (rect.height / 2)) / 10;
            const rotateY = ((rect.width / 2) - x) / 10;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
        });

        // PDF'TEN FLIPBOOK OLUŞTURMA MOTORU
        let pageFlip = null;
        let isLoaded = false;

        async function openMagazine() {
            document.getElementById('magazine-modal').style.display = 'flex';

            if (isLoaded) return;

            try {
                // dergi.pdf dosyasını yükle
                const pdf = await pdfjsLib.getDocument('dergi.pdf').promise;
                const bookElem = document.getElementById('book');

                // PDF'teki her sayfayı Canvas olarak oluştur
                for (let num = 1; num <= pdf.numPages; num++) {
                    const page = await pdf.getPage(num);
                    const viewport = page.getViewport({ scale: 2 });

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    
                    pageDiv.appendChild(canvas);
                    bookElem.appendChild(pageDiv);
                }

                document.getElementById('loading-text').style.display = 'none';
                bookElem.style.display = 'block';

                // Flipbook başlat
                pageFlip = new St.PageFlip(bookElem, {
                    width: 450,
                    height: 636,
                    size: "fixed",
                    minWidth: 300,
                    maxWidth: 1000,
                    minHeight: 400,
                    maxHeight: 1400,
                    maxShadowOpacity: 0.8,
                    showCover: true
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));
                isLoaded = true;

            } catch (err) {
                console.error("PDF Yükleme hatası:", err);
                document.getElementById('loading-text').innerText = "PDF yüklenirken hata oluştu. Lütfen dergi.pdf dosyasını kontrol edin.";
            }
        }

        function closeMagazine() {
            document.getElementById('magazine-modal').style.display = 'none';
        }
    </script>
</body>
</html>
