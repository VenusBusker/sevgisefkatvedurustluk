<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevgi, şefkat & dürüstlük</title>
    
    <!-- Google Fonts: Instrument Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    
    <!-- PDF.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* ROSEMARY'S BABY KEMİK RENGİ ARKA PLAN */
        body { 
            background-color: #f4f0ea; 
            color: #1a1a1a; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* HEADER */
        header { text-align: center; margin-bottom: 50px; margin-top: 20px; }
        h1.site-title {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(3em, 8vw, 5.5em);
            font-weight: 400;
            color: #111;
            line-height: 1;
        }
        nav { margin-top: 15px; display: flex; gap: 20px; justify-content: center; }
        nav a { color: #666; text-decoration: none; font-size: 0.9em; letter-spacing: 1px; text-transform: uppercase; }

        /* GRID ALANI */
        .magazines-grid { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; max-width: 1200px; width: 100%; }

        /* KART */
        .card-container { perspective: 1000px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .card {
            width: 300px; height: 424px; border-radius: 10px;
            background-size: cover; background-position: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            transition: transform 0.1s ease-out; position: relative; overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        .card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(115deg, transparent 20%, rgba(255, 0, 150, 0.3) 40%, rgba(255, 255, 255, 0.8) 50%, rgba(0, 225, 255, 0.3) 60%, transparent 80%);
            mix-blend-mode: color-dodge; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .card:hover::before { opacity: 1; }
        .card-info { margin-top: 15px; text-align: center; }
        .card-title { font-family: 'Instrument Serif', serif; font-size: 1.5em; color: #111; }
        .card-sub { font-size: 0.85em; color: #777; margin-top: 2px; }

        /* DİKEY AKIŞLI VEKTÖREL (SVG) MODAL OKUYUCU */
        #reader-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(8, 8, 8, 0.97); z-index: 9999;
            flex-direction: column; align-items: center;
            overflow-y: auto;
            padding: 60px 10px;
            scroll-behavior: smooth;
        }

        .vertical-stream {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            max-width: 850px;
            width: 100%;
        }

        /* SVG POSTER KUTUSU */
        .page-poster {
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border-radius: 4px;
            overflow: hidden;
            background: transparent;
            display: flex;
            justify-content: center;
        }

        /* SVG ELEMANI DÜZENLEMESİ */
        .page-poster svg {
            width: 100% !important;
            height: auto !important;
            display: block;
        }

        /* KAPATMA BUTONU */
        .close-btn {
            position: fixed; top: 20px; right: 30px;
            color: #fff; font-size: 2.5em; cursor: pointer; z-index: 10001; opacity: 0.8; transition: 0.2s;
            background: rgba(0, 0, 0, 0.5);
            width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 50%;
        }
        .close-btn:hover { color: #ff0055; opacity: 1; background: rgba(0,0,0,0.8); }

        #loading-text { font-size: 1.1em; color: #ff0055; letter-spacing: 2px; margin-top: 40vh; }
    </style>
</head>
<body>

    <header>
        <h1 class="site-title">Sevgi, şefkat & dürüstlük</h1>
        <nav><a href="#">Sayılar</a></nav>
    </header>

    <main class="magazines-grid" id="gridContainer"></main>

    <div id="reader-modal">
        <span class="close-btn" onclick="closeReader()">&times;</span>
        <div id="loading-text" style="display:none;">Selam, nasılsın?</div>
        <div class="vertical-stream" id="streamContainer"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null;

        async function loadMagazines() {
            try {
                const res = await fetch('dergiler.json');
                const magazines = await res.json();
                const grid = document.getElementById('gridContainer');

                magazines.forEach(mag => {
                    const cardBox = document.createElement('div');
                    cardBox.className = 'card-container';
                    cardBox.onclick = () => openReader(mag.pdfDosya);

                    cardBox.innerHTML = `
                        <div class="card" style="background-image: url('${mag.kapakGorsel}')"></div>
                        <div class="card-info">
                            <div class="card-title">${mag.baslik}</div>
                            <div class="card-sub">${mag.altBaslik || ''}</div>
                        </div>
                    `;

                    const cardElem = cardBox.querySelector('.card');
                    cardBox.addEventListener('mousemove', (e) => {
                        const rect = cardElem.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        const rotateX = (y - (rect.height / 2)) / 10;
                        const rotateY = ((rect.width / 2) - x) / 10;
                        cardElem.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
                    });

                    cardBox.addEventListener('mouseleave', () => {
                        cardElem.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
                    });

                    grid.appendChild(cardBox);
                });
            } catch (err) {
                console.error("Dergiler yüklenemedi:", err);
            }
        }

        async function openReader(pdfPath) {
            const modal = document.getElementById('reader-modal');
            const stream = document.getElementById('streamContainer');
            const loading = document.getElementById('loading-text');

            stream.innerHTML = '';
            modal.style.display = 'flex';
            loading.style.display = 'block';

            try {
                pdfDoc = await pdfjsLib.getDocument(pdfPath).promise;
                loading.style.display = 'none';

                for (let num = 1; num <= pdfDoc.numPages; num++) {
                    const page = await pdfDoc.getPage(num);
                    const viewport = page.getViewport({ scale: 1.5 });

                    const pageContainer = document.createElement('div');
                    pageContainer.className = 'page-poster';

                    // SVG Grafik Oluşturma Motoru
                    const opList = await page.getOperatorList();
                    const svgGfx = new pdfjsLib.SVGGraphics(page.commonObjs, page.objs);
                    const svg = await svgGfx.getSVG(opList, viewport);

                    // Taşma veya sınır hesaplama hatalarını engelleyen ayarlar
                    svg.removeAttribute('width');
                    svg.removeAttribute('height');
                    svg.setAttribute('viewBox', `0 0 ${viewport.width} ${viewport.height}`);

                    pageContainer.appendChild(svg);
                    stream.appendChild(pageContainer);
                }

            } catch (err) {
                console.error("PDF SVG Yükleme hatası:", err);
                loading.innerText = "PDF YÜKLENEMEDİ";
            }
        }

        function closeReader() {
            document.getElementById('reader-modal').style.display = 'none';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeReader();
        });

        loadMagazines();
    </script>
</body>
</html>
