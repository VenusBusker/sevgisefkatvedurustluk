<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevgi, Şefkat & Dürüstlük</title>
    <!-- PDF.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0d0d; color: #fff; font-family: -apple-system, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; user-select: none; }

        /* 1. EKRAN: METALİK OYUN KARTI */
        .card-container { perspective: 1000px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .card-hint { margin-top: 20px; font-size: 0.85em; letter-spacing: 2px; color: #888; text-transform: uppercase; animation: pulse 2s infinite; }
        
        .card {
            width: 320px;
            height: 452px;
            border-radius: 12px;
            background-image: url('Kapak.png');
            background-size: cover;
            background-position: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            transition: transform 0.1s ease-out;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(115deg, transparent 20%, rgba(255, 0, 150, 0.4) 40%, rgba(255, 255, 255, 0.7) 50%, rgba(0, 225, 255, 0.4) 60%, transparent 80%);
            mix-blend-mode: color-dodge;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .card:hover::before { opacity: 1; }

        /* 2. EKRAN: ÇİFT SAYFALI SPREAD SLIDER MODAL */
        #reader-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 5, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spread-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            max-width: 95vw;
            max-height: 85vh;
            transition: transform 0.4s ease-in-out, opacity 0.3s ease;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            background: #000;
            padding: 10px;
            border-radius: 6px;
        }

        canvas {
            max-height: 80vh;
            width: auto;
            object-fit: contain;
            display: block;
        }

        /* Navigasyon & Kapatma */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: none;
            font-size: 2.2em;
            padding: 20px 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
            z-index: 10000;
        }
        .nav-btn:hover { background: rgba(255, 0, 85, 0.8); }
        .prev-btn { left: 25px; }
        .next-btn { right: 25px; }

        .close-btn {
            position: absolute;
            top: 20px; right: 30px;
            color: #fff; font-size: 2.5em; cursor: pointer;
            z-index: 10001; opacity: 0.7; transition: 0.2s;
        }
        .close-btn:hover { color: #ff0055; opacity: 1; }

        .page-counter {
            position: absolute;
            bottom: 20px;
            color: #666;
            font-size: 0.85em;
            letter-spacing: 2px;
        }

        #loading-text { font-size: 1.1em; color: #ff0055; letter-spacing: 2px; }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- GİRİŞ: METALİK KART -->
    <div class="card-container" id="cardContainer" onclick="openReader()">
        <div class="card" id="metalCard"></div>
        <div class="card-hint">✨ DERGİYİ OKUMAK İÇİN TIKLA ✨</div>
    </div>

    <!-- DERGİ OKUYUCU MODALI -->
    <div id="reader-modal">
        <span class="close-btn" onclick="closeReader()">&times;</span>
        
        <button class="nav-btn prev-btn" onclick="changeSpread(-1)">&#10094;</button>
        
        <div id="loading-text">YÜKLENİYOR...</div>
        
        <div class="spread-container" id="spreadBox" style="display:none;">
            <canvas id="leftCanvas"></canvas>
            <canvas id="rightCanvas"></canvas>
        </div>
        
        <button class="nav-btn next-btn" onclick="changeSpread(1)">&#10095;</button>

        <div class="page-counter" id="pageCounter">- / -</div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null;
        let currentSpread = 0; // 0: Kapak, 1: Sayfa 2-3, 2: Sayfa 4-5...
        let totalSpreads = 0;

        // 3D Metalik Kart Hareketi
        const card = document.getElementById('metalCard');
        const container = document.getElementById('cardContainer');

        container.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rotateX = (y - (rect.height / 2)) / 10;
            const rotateY = ((rect.width / 2) - x) / 10;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
        });

        // Reader Açılış
        async function openReader() {
            document.getElementById('reader-modal').style.display = 'flex';
            
            if (!pdfDoc) {
                try {
                    pdfDoc = await pdfjsLib.getDocument('dergi.pdf').promise;
                    totalSpreads = Math.ceil(pdfDoc.numPages / 2);
                    document.getElementById('loading-text').style.display = 'none';
                    document.getElementById('spreadBox').style.display = 'flex';
                    renderSpread(currentSpread);
                } catch (err) {
                    console.error("PDF Yüklenemedi:", err);
                    document.getElementById('loading-text').innerText = "dergi.pdf YÜKLENEMEDİ!";
                }
            }
        }

        async function renderCanvas(pageNum, canvasId) {
            const canvas = document.getElementById(canvasId);
            if (pageNum > pdfDoc.numPages) {
                canvas.style.display = 'none';
                return;
            }
            
            canvas.style.display = 'block';
            const page = await pdfDoc.getPage(pageNum);
            const ctx = canvas.getContext('2d');
            const viewport = page.getViewport({ scale: 2 });
            
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        }

        async function renderSpread(spreadIdx) {
            const spreadBox = document.getElementById('spreadBox');
            spreadBox.style.opacity = '0.3';

            if (spreadIdx === 0) {
                // Sadece Kapak
                await renderCanvas(1, 'leftCanvas');
                document.getElementById('rightCanvas').style.display = 'none';
                document.getElementById('pageCounter').innerText = `KAPAK`;
            } else {
                // Çift Sayfa Mantığı (Sayfa 2 & 3, Sayfa 4 & 5...)
                const leftPageNum = spreadIdx * 2;
                const rightPageNum = leftPageNum + 1;

                await renderCanvas(leftPageNum, 'leftCanvas');
                if (rightPageNum <= pdfDoc.numPages) {
                    await renderCanvas(rightPageNum, 'rightCanvas');
                    document.getElementById('pageCounter').innerText = `SAYFA ${leftPageNum} - ${rightPageNum} / ${pdfDoc.numPages}`;
                } else {
                    document.getElementById('rightCanvas').style.display = 'none';
                    document.getElementById('pageCounter').innerText = `SAYFA ${leftPageNum} / ${pdfDoc.numPages}`;
                }
            }

            spreadBox.style.opacity = '1';
        }

        function changeSpread(delta) {
            if (!pdfDoc) return;
            const newSpread = currentSpread + delta;
            if (newSpread < 0 || newSpread > totalSpreads) return;
            
            currentSpread = newSpread;
            renderSpread(currentSpread);
        }

        function closeReader() {
            document.getElementById('reader-modal').style.display = 'none';
        }

        // Klavye Kontrolleri
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('reader-modal').style.display === 'flex') {
                if (e.key === 'ArrowRight') changeSpread(1);
                if (e.key === 'ArrowLeft') changeSpread(-1);
                if (e.key === 'Escape') closeReader();
            }
        });
    </script>
</body>
</html>
