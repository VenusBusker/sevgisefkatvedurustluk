<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevgi, Şefkat & Dürüstlük</title>
    <!-- PDF.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0d0d; color: #fff; font-family: -apple-system, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; user-select: none; }

        /* 1. EKRAN: METALİK OYUN KARTI */
        .card-container { perspective: 1000px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .card-hint { margin-top: 20px; font-size: 0.85em; letter-spacing: 2px; color: #888; text-transform: uppercase; animation: pulse 2s infinite; }
        
        .card {
            width: 320px;
            height: 452px;
            border-radius: 12px;
            background-image: url('Kapak.png'); /* Kapak kartı görselin */
            background-size: cover;
            background-position: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            transition: transform 0.1s ease-out;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(115deg, transparent 20%, rgba(255, 0, 150, 0.4) 40%, rgba(255, 255, 255, 0.7) 50%, rgba(0, 225, 255, 0.4) 60%, transparent 80%);
            mix-blend-mode: color-dodge;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .card:hover::before { opacity: 1; }

        /* 2. EKRAN: PDF DERGİ OKUYUCU MODAL */
        #reader-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 5, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .reader-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            border-radius: 4px;
        }

        /* Navigasyon Butonları ve Kapatma */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            font-size: 2em;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
            z-index: 10000;
        }
        .nav-btn:hover { background: rgba(255, 0, 85, 0.8); }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        .close-btn {
            position: absolute;
            top: 20px; right: 30px;
            color: #fff; font-size: 2.5em; cursor: pointer;
            z-index: 10001; opacity: 0.7; transition: 0.2s;
        }
        .close-btn:hover { color: #ff0055; opacity: 1; }

        .page-counter {
            position: absolute;
            bottom: 20px;
            color: #666;
            font-size: 0.9em;
            letter-spacing: 2px;
        }

        #loading-text { font-size: 1.1em; color: #ff0055; letter-spacing: 2px; }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- GİRİŞ: METALİK KART -->
    <div class="card-container" id="cardContainer" onclick="openReader()">
        <div class="card" id="metalCard"></div>
        <div class="card-hint">✨ DERGİYİ OKUMAK İÇİN TIKLA ✨</div>
    </div>

    <!-- DERGİ OKUYUCU MODALI -->
    <div id="reader-modal">
        <span class="close-btn" onclick="closeReader()">&times;</span>
        
        <button class="nav-btn prev-btn" onclick="changePage(-1)">&#10094;</button>
        
        <div class="reader-content">
            <div id="loading-text">YÜKLENİYOR...</div>
            <canvas id="pdfCanvas" style="display:none;"></canvas>
        </div>
        
        <button class="nav-btn next-btn" onclick="changePage(1)">&#10095;</button>

        <div class="page-counter" id="pageCounter">1 / -</div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;

        // --- 1. 3D METALİK KART HAREKETİ ---
        const card = document.getElementById('metalCard');
        const container = document.getElementById('cardContainer');

        container.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rotateX = (y - (rect.height / 2)) / 10;
            const rotateY = ((rect.width / 2) - x) / 10;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
        });

        // --- 2. PDF OKUYUCU MANTIĞI ---
        async function openReader() {
            document.getElementById('reader-modal').style.display = 'flex';
            
            if (!pdfDoc) {
                try {
                    pdfDoc = await pdfjsLib.getDocument('dergi.pdf').promise;
                    document.getElementById('loading-text').style.display = 'none';
                    document.getElementById('pdfCanvas').style.display = 'block';
                    renderPage(pageNum);
                } catch (err) {
                    console.error("PDF Yüklenemedi:", err);
                    document.getElementById('loading-text').innerText = "dergi.pdf YÜKLENEMEDİ!";
                }
            }
        }

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then((page) => {
                const canvas = document.getElementById('pdfCanvas');
                const ctx = canvas.getContext('2d');
                
                // Yüksek netlik için scale 2 yapıyoruz
                const viewport = page.getViewport({ scale: 2 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                page.render(renderContext).promise.then(() => {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            document.getElementById('pageCounter').innerText = `${num} / ${pdfDoc.numPages}`;
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function changePage(delta) {
            if (!pdfDoc) return;
            if (pageNum + delta < 1 || pageNum + delta > pdfDoc.numPages) return;
            pageNum += delta;
            queueRenderPage(pageNum);
        }

        function closeReader() {
            document.getElementById('reader-modal').style.display = 'none';
        }

        // Klavyeden Ok Tuşları İle Geçiş
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('reader-modal').style.display === 'flex') {
                if (e.key === 'ArrowRight') changePage(1);
                if (e.key === 'ArrowLeft') changePage(-1);
                if (e.key === 'Escape') closeReader();
            }
        });
    </script>
</body>
</html>
