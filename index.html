<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapak</title>
    
    <!-- -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <style>
        :root {
            
            --bg-color: #e5e2cb;
            --text-color: #24221f;
            --card-bg: #dad6be;
            --border-color: #24221f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px; 
            overflow: hidden;
        }

        
        .card-container {
            width: 320px;
            height: 480px;
            perspective: 1000px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .card {
            width: 100%;
            height: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        
        .card-title {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: 2.8rem;
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: -0.5px;
            text-align: center;
            margin-top: auto;
            margin-bottom: auto;
            transform: translateZ(30px); 
        }

        .card-meta {
            font-family: 'Instrument Serif', Georgia, serif;
            font-style: italic;
            font-size: 1.1rem;
            text-align: center;
            opacity: 0.8;
            transform: translateZ(20px);
        }

        .card-hint {
            font-family: 'Georgia', serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            opacity: 0.5;
            transform: translateZ(15px);
        }

        
        .card-border {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(36, 34, 31, 0.2);
            pointer-events: none;
            transform: translateZ(10px);
        }
    </style>
</head>
<body>

    <a href="gunesyanigi.html" class="card-container" id="cardContainer">
        <div class="card" id="tiltCard">
            <div class="card-border"></div>
            <div class="card-hint">Oku.</div>
            <div class="card-title">Güneş Yanığı</div>
            <div class="card-meta">Kullanıcı Adı</div>
        </div>
    </a>

    <script>
        const container = document.getElementById('cardContainer');
        const card = document.getElementById('tiltCard');

        
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // Dönme açıları
            const rotateX = ((y - centerY) / centerY) * -15; 
            const rotateY = ((x - centerX) / centerX) * 15;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
            card.style.boxShadow = `${-rotateY * 1.5}px ${rotateX * 1.5}px 30px rgba(0,0,0,0.12)`;
        });


      
        container.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            card.style.boxShadow = '0 10px 20px rgba(0,0,0,0.05)';
        });
    </script>

</body>
</html>
