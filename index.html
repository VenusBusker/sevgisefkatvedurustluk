<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devam Eden Öyküler</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <style>
        /* PALET 3: Soluk Pudra / Somon */
        :root {
            --bg-color: #e8ddd7;
            --card-bg: #f4efea;
            --text-color: #221e1f;
            --border-color: rgba(34, 30, 31, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Georgia', serif;
            overflow: hidden; /* Sayfa dikeyde asla kaymaz ve taşmaz */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* MİNİMAL ÜST BAŞLIK */
        .site-header {
            margin-bottom: 35px;
            text-align: center;
            flex-shrink: 0;
        }

        .site-title {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        /* SLIDER / KART SERGİ ALANI */
        .slider-container {
            width: 100%;
            max-width: 850px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 10px;
        }

        .cards-wrapper {
            display: flex;
            gap: 35px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            padding: 20px 15px;
            width: 100%;
            /* Taşmaları ve hizayı sabitleme */
            align-items: center;
            justify-content: flex-start;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* Kartlar tek ise veya az ise ortala */
        .cards-wrapper.center-items {
            justify-content: center;
        }

        .cards-wrapper::-webkit-scrollbar {
            display: none;
        }

        /* DİNAMİK KİTAP KAPAKLARI */
        .book-card {
            flex: 0 0 auto;
            width: 200px;
            height: 300px;
            perspective: 1000px;
            text-decoration: none;
            cursor: pointer;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.25s ease-out, box-shadow 0.25s ease-out;
            border-radius: 2px 4px 4px 2px;
            box-shadow: -3px 6px 18px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .book img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Sol Kenar Cilt Gölgelendirmesi */
        .book::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 10px;
            height: 100%;
            background: linear-gradient(to right, 
                rgba(0,0,0,0.2) 0%, 
                rgba(0,0,0,0.05) 50%, 
                rgba(255,255,255,0.1) 80%, 
                rgba(0,0,0,0) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .glare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 60%);
            z-index: 3;
            pointer-events: none;
        }

        .nav-btn {
            background: transparent;
            border: none;
            font-size: 1.8rem;
            color: var(--text-color);
            cursor: pointer;
            padding: 10px;
            opacity: 0.35;
            transition: opacity 0.2s;
            user-select: none;
            flex-shrink: 0;
        }

        .nav-btn:hover {
            opacity: 0.85;
        }

        @media (max-width: 600px) {
            .site-title {
                font-size: 1.8rem;
            }
            .book-card {
                width: 175px;
                height: 262px;
            }
            .nav-btn {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="site-title">Devam Eden Öyküler</h1>
    </header>

    <div class="slider-container">
        <button class="nav-btn" onclick="scrollSlider(-240)">‹</button>

        <!-- Kartlar JSON verisiyle dinamik yüklenecek -->
        <div class="cards-wrapper" id="cardsWrapper"></div>

        <button class="nav-btn" onclick="scrollSlider(240)">›</button>
    </div>

    <script>
        // oykuler.json dosyasından verileri otomatik çekip kartları basar
        async function loadStories() {
            const wrapper = document.getElementById('cardsWrapper');
            try {
                const response = await fetch('oykuler.json');
                const stories = await response.json();

                wrapper.innerHTML = '';

                // Eğer kart sayısı azsa ekranda ortala, çoksa sola hizalayıp kaydırılabilir yap
                if (stories.length <= 3) {
                    wrapper.classList.add('center-items');
                } else {
                    wrapper.classList.remove('center-items');
                }

                stories.forEach(story => {
                    const cardHTML = `
                        <a href="${story.link}" class="book-card">
                            <div class="book tilt-card">
                                <div class="glare"></div>
                                <img src="${story.kapak}" alt="${story.baslik}">
                            </div>
                        </a>
                    `;
                    wrapper.innerHTML += cardHTML;
                });

                initTiltEffect();

            } catch (err) {
                console.error("Öyküler yüklenirken hata oluştu:", err);
            }
        }

        function scrollSlider(distance) {
            document.getElementById('cardsWrapper').scrollBy({
                left: distance,
                behavior: 'smooth'
            });
        }

        // 3D Tilt Efekti
        function initTiltEffect() {
            const cards = document.querySelectorAll('.tilt-card');
            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -8; 
                    const rotateY = ((x - centerX) / centerX) * 8;

                    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                    card.style.boxShadow = `${-rotateY * 1.2}px ${rotateX * 1.2 + 8}px 20px rgba(0,0,0,0.15)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
                    card.style.boxShadow = '-3px 6px 18px rgba(0, 0, 0, 0.12)';
                });
            });
        }

        loadStories();
    </script>

</body>
</html>
