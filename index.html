<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öykü</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Rosemary's Baby pastel sarı/yeşililmsi arkaplan */
            --bg-color: #e5e2cb;
            --card-bg: #dad6be;
            --border-color: #24221f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            overflow: hidden;
            font-family: 'Instrument Serif', Georgia, serif;
        }

        .card-container {
            width: 300px;
            height: 450px;
            perspective: 1000px;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .card {
            width: 100%;
            height: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
            border-radius: 4px;
            padding: 10px;
        }

        /* Yükleyeceğiniz kapak resmi kartın içine tam oturur */
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
            display: block;
            pointer-events: none;
        }

        .card-border {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid rgba(36, 34, 31, 0.3);
            pointer-events: none;
            z-index: 2;
            transform: translateZ(10px);
        }
    </style>
</head>
<body>

    <!-- Karta tıklandığında oyku.html sayfasına gider -->
    <a href="oyku.html" class="card-container" id="cardContainer">
        <div class="card" id="tiltCard">
            <div class="card-border"></div>
            <!-- Kapak Resminiz Buraya Gelecek -->
            <img src="kapak.jpg" alt="Öykü Kapağı">
        </div>
    </a>

    <script>
        const container = document.getElementById('cardContainer');
        const card = document.getElementById('tiltCard');

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -15; 
            const rotateY = ((x - centerX) / centerX) * 15;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
            card.style.boxShadow = `${-rotateY * 1.5}px ${rotateX * 1.5}px 30px rgba(0,0,0,0.15)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            card.style.boxShadow = '0 10px 25px rgba(0,0,0,0.08)';
        });
    </script>

</body>
</html>
