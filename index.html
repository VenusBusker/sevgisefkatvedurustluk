<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapak</title>
    
    <style>
        :root {
            /* Rosemary's Baby pastel zemin */
            --bg-color: #e5e2cb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            overflow: hidden;
        }

        /* KİTAP KAPAK KONTEYNERİ */
        .book-container {
            width: 300px;
            height: 450px;
            perspective: 1200px;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
            border-radius: 2px 6px 6px 2px;
            box-shadow: -5px 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        /* KAPAK RESMİ */
        .book img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* KİTAP SIRTI CİLT GÖLGESİ (Sol kenardaki kıvrım hissi) */
        .book::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 15px;
            height: 100%;
            background: linear-gradient(to right, 
                rgba(0,0,0,0.3) 0%, 
                rgba(0,0,0,0.1) 50%, 
                rgba(255,255,255,0.15) 80%, 
                rgba(0,0,0,0) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* İŞIK YANSIMASI (Glare Efekti) */
        .glare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 60%);
            z-index: 3;
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- Bağlantı adını kendi dosya adınızla güncelleyin -->
    <a href="gunesyanigi.html" class="book-container" id="bookContainer">
        <div class="book" id="tiltBook">
            <div class="glare"></div>
            <img src="kapak.jpg" alt="Kitap Kapağı">
        </div>
    </a>

    <script>
        const container = document.getElementById('bookContainer');
        const book = document.getElementById('tiltBook');

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -12; 
            const rotateY = ((x - centerX) / centerX) * 12;

            book.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            book.style.boxShadow = `${-rotateY * 2}px ${rotateX * 2 + 15}px 35px rgba(0,0,0,0.25)`;
        });

        container.addEventListener('mouseleave', () => {
            book.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            book.style.boxShadow = '-5px 10px 25px rgba(0, 0, 0, 0.2)';
        });
    </script>

</body>
</html>
